{% extends "base.html" %}

{% block title %}{{ page_title }} - 1ITDA{% endblock %}

{% block content %}
<section class="company-page company-form-page">
  <div class="company-page-header"><div><p class="company-eyebrow">JOB POSTING</p><h1>{{ page_title }}</h1><p>등록 후 관리자 승인 절차가 진행됩니다.</p></div></div>
  <form class="company-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label for="title">공고 제목 *</label><input id="title" name="title" maxlength="200" required value="{{ request.form.get('title', job.title if job else '') }}"></div>
    <div class="company-form-row">
      <div class="form-group"><label for="region">지역</label><input id="region" name="region" maxlength="80" value="{{ request.form.get('region', job.region if job and job.region else '') }}"></div>
      <div class="form-group"><label for="industry">업종</label><input id="industry" name="industry" maxlength="80" value="{{ request.form.get('industry', job.industry if job and job.industry else '') }}"></div>
      <div class="form-group"><label for="deadline">마감일</label><input type="date" id="deadline" name="deadline" value="{{ request.form.get('deadline', job.deadline.isoformat() if job and job.deadline else '') }}"></div>
    </div>
    <div class="form-group"><label for="content">공고 내용 *</label><textarea id="content" name="content" maxlength="10000" rows="14" required>{{ request.form.get('content', job.content if job else '') }}</textarea></div>
    <div class="company-form-actions"><a class="btn btn-outline" href="{{ url_for('company.dashboard') }}">취소</a><button class="btn btn-primary" type="submit">저장</button></div>
  </form>
</section>
{% endblock %}
