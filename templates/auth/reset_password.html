{% extends "base.html" %}

{% block title %}비밀번호 재설정 - 1ITDA{% endblock %}

{% block content %}
<section class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-badge">NEW PASSWORD</span>
      <h1>새 비밀번호 설정</h1>
      <p>기존 비밀번호와 다른 8자 이상의 비밀번호를 입력해 주세요.</p>
    </div>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="new_password">새 비밀번호</label>
        <input type="password" id="new_password" name="new_password" minlength="8" maxlength="72" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="new_password_confirm">새 비밀번호 확인</label>
        <input type="password" id="new_password_confirm" name="new_password_confirm" minlength="8" maxlength="72" autocomplete="new-password" required>
      </div>
      <button type="submit" class="auth-submit">비밀번호 변경</button>
    </form>
  </div>
</section>
{% endblock %}
