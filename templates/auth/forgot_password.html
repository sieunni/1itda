{% extends "base.html" %}

{% block title %}비밀번호 찾기 - 1ITDA{% endblock %}

{% block content %}
<section class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-badge">PASSWORD RESET</span>
      <h1>비밀번호 찾기</h1>
      <p>가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
    </div>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" maxlength="255" autocomplete="email" required>
      </div>
      <button type="submit" class="auth-submit">재설정 링크 받기</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></p>
  </div>
</section>
{% endblock %}
